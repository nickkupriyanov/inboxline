name: Version packages

# Version PRs are enabled immediately. Publishing, tags and GitHub releases
# require the repository variable NPM_PUBLISH_ENABLED=true and NPM_TOKEN.
# Enable only after explicit approval of the release candidate (docs/release.md).
# PRs created with GITHUB_TOKEN do not trigger CI; check the version PR locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: version-packages

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    name: Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release readiness
        run: pnpm check:release

      - name: Create the version PR or publish the approved release
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
          push-git-tags: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
