name: Version packages

# Opens or updates the "Version Packages" pull request from the changesets on
# main. Merging that PR only consumes the changesets: this workflow never
# publishes to npm and never tags a release. Publishing is a separate, explicit
# local action documented in docs/release.md.
#
# The PR is created with GITHUB_TOKEN, so GitHub suppresses workflow runs it
# triggers; the PR contains only version numbers and changelogs. Run CI locally
# before merging it, or add a PAT if the PR should carry its own checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: version-packages

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the version PR
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: false
          push-git-tags: false
