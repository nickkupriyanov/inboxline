name: Stage inspect

# Temporary diagnostic for the first staged npm release. Lists the staged
# versions visible to NPM_TOKEN without publishing or approving anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: List staged versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes npm@11.20.0 stage list --json
